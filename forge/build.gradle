plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

base {
    archivesName = 'purpleclient-forge-26.3'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

minecraft {
    mappings channel: 'official', version: '26.3'
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.8')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
