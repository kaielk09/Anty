name: Build Purple Client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Fabric, Forge and NeoForge
        run: gradle --no-daemon :fabric:build :forge:build :neoforge:build --stacktrace

      - name: Upload three loader JARs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Purple-Client-Minecraft-26.3
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
